[project]
name = "smartitr-backend"
version = "0.1.0"
description = "SmartITR FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.1.19",
  "python-json-logger>=2.0.7",
  "boto3>=1.35.0",
  "python-jose[cryptography]>=3.3.0",
  "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

